<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In / Sign Up</title>
    <link rel="stylesheet" href="../css/signin.css">
        <link href="https://fonts.googleapis.com/css2?family=Tourney:wght@400;700&display=swap" rel="stylesheet">
            <link href="https://fonts.googleapis.com/css2?family=Boldonse&display=swap" rel="stylesheet">
</head>
<body>

    <!-- TOGGLE FOR SLIDE -->
    <input type="checkbox" id="toggle">

    <div class="container">

        <div class="form-wrapper">

            <!-- LOGIN FORM -->
            <div class="form">
                <h2>Sign In</h2>

                <form action="sample2..html">
                    <input type="text" placeholder="Username" pattern="user123" required>
                    <input type="password" placeholder="Password" pattern="123456" required>
                    <button type="submit">Login</button>
                </form>

                <div class="switch">
                    Don't have an account? 
                    <label for="toggle">Sign Up</label>
                </div>
            </div>

            <!-- SIGN UP FORM -->
            <div class="form">
                <h2>Sign Up</h2>

                <form action="../html/new acc.html">
                    <div class="firstname">
                        <input type="text" placeholder="First Name" required>
                        <input type="text" placeholder="Last Name" required>
                    </div>
                    <input type="email" placeholder="Email" required>
                    <input type="tel" placeholder="+639XXXXXXXXX" pattern="^(09|\+639)\d{9}$" required>
                    <input type="text" placeholder="Username" required>
                    <input type="password" placeholder="Password" required>

                    <!-- Popup trigger -->
                    <input type="checkbox" id="popup">
                    <button type="submit" class="submit-btn">Register</button>
                </form>

                <div class="popup-content">
                    <h3>✅ Registered Successfully!</h3>
                    <p>Please wait for admin approval.</p>
                    <label for="popup" class="close-btn">OK</label>
                </div>

                <div class="terms">
                    <label>
                        <input type="checkbox" required>
                        By signing up, you agree to our Terms & Conditions
                    </label>
                </div>

                <div class="switch">
                    Already have an account? 
                    <label for="toggle">Sign In</label>
                </div>
            </div>

        </div>

    </div>

</body>
</html>
