<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waiting for Approval</title>

    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Boldonse&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-image: url("../pictures/bg.admin.jpg");
            background-size: cover;
            background-position: center;
            min-height: 100vh;
        }

        /* NAVBAR */
        .navbar {
            background: linear-gradient(343deg,#fceadc,#fce6d7,#eda553);
            padding: 15px;
            color: black;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: "Boldonse", system-ui;
        }

        .logo {
            text-decoration: none;
            font-size: 29px;
            color: black;
        }

        .navbar-a {
            display: flex;
            gap: 15px;
        }

        .navbar-a a {
            color: black;
            font-weight: 500;
            padding: 5px 10px;
            border-radius: 9px;
            text-decoration: none;
            transition: 0.3s ease;
        }

        .navbar-a a:hover {
            color: #f35900;
            background: rgba(255, 255, 255, 0.6);
        }

        /* CONTENT */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80vh;
        }

        .box {
            background: rgba(255, 255, 255, 0.708);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            font-family: "Boldonse", system-ui;
            max-width: 400px;
            width: 90%;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            margin: 5px 0;
        }

        button {
            padding: 12px 25px;
            margin-top: 20px;
            border: none;
            background: green;
            color: white;
            cursor: pointer;
            border-radius: 10px;
            font-size: 16px;
            transition: 0.3s ease;
        }

        button:hover {
            background: darkgreen;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

   
    <!-- MESSAGE -->
    <div class="container animate__animated animate__fadeIn animate__slow">
        <div class="box animate__animated animate__zoomIn animate__delay-0.5s">
            <h1>Edited</h1>
            <p>You finish editing your vehicle</p>
            <button onclick="location.href='admin2.html'">Back to Admin</button>
        </div>
    </div>

</body>
</html>
